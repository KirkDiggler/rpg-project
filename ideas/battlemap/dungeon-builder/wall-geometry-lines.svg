<circle cx="70" cy="470.0" r="3.6" fill="#15803d"/><text x="80" y="474.0" fill="#333">six side midpoints, box fractions (±0.5, 0) and (±0.25, ±0.375): where thin walls start, end, and turn</text>
<circle cx="70" cy="488.0" r="3" fill="none" stroke="#999" stroke-width="1.2"/><text x="80" y="492.0" fill="#333">corners: dropped — a line through corners either halves cells or closes no corner</text>
<circle cx="70" cy="506.0" r="3.8" fill="#d97706"/><text x="80" y="510.0" fill="#333">the seventh position, the centre: where thick walls turn (free — a thick wall seals it anyway); a thin wall ending here pays that one cell</text>
<text x="70" y="532.0" fill="#555">Twelve directions, 30° apart. Along rows of neighbours (0°, 60°, 120°): midpoint line or centre line. Along sides (30°, 90°, 150°): quarter line or flat-side line.</text>
<text x="70" y="548.0" fill="#555">A rectangle needs one direction from each family. Which of the two lines in a family you pick is thin-and-shaved versus thick-and-whole.</text>
