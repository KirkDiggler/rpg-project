<text x="70" y="28" font-size="15" font-weight="600" fill="#222">Where a wall can go (pointy-top, odd-r)</text>
<text x="70" y="48" fill="#555">green = thin wall: shaves the hatched slivers, kills nothing · orange = thick wall: on the flat sides, leaves neighbours whole,</text>
<text x="70" y="64" fill="#555">but seals every grey cell it runs through the centre of · thin lines end on midpoints (green), thick lines may also end on centres (orange)</text>
