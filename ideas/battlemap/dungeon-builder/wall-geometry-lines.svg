<text x="344.7" y="208.0" fill="#7c2d12" font-weight="600">door, even rows only</text>
<text x="494.22809220139277" y="187.0" fill="#15803d" font-weight="600">midpoint line · shaves 1/24 each side · a door at every midpoint</text>
<text x="494.22809220139277" y="292.0" fill="#b45309" font-weight="600">centre line · a wall one cell thick · seals the whole row</text>
<text x="203.4" y="424.0" text-anchor="middle" fill="#15803d" font-weight="600">quarter line · shaves 5/24, alternating sides · doors every row</text>
<text x="376.7" y="442.0" text-anchor="middle" fill="#b45309" font-weight="600">flat-side line · even rows whole · seals one odd-row cell per two rows</text>
