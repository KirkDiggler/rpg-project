<text x="80" y="22">Finch</text><text x="330" y="22">the run's world</text><text x="590" y="22">Bram</text>
</g>
<g stroke="#2a2c30" stroke-width="1" opacity=".35">
<line x1="80" y1="32" x2="80" y2="220"/><line x1="330" y1="32" x2="330" y2="220"/><line x1="590" y1="32" x2="590" y2="220"/>
