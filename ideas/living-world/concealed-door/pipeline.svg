<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-label="Five-stage pipeline: builder YAML through dungeonspec, the compiled field, the run's world, to each member's wire, with concealment carried opaquely until the world acts on it."><rect x="0" y="0" width="720" height="150" fill="#f1f0ec" rx="6"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2c30"/></marker></defs>
<g fill="none" stroke="#2a2c30" stroke-width="1.3">
<rect x="8" y="30" width="118" height="52" rx="4"/>
<rect x="162" y="30" width="118" height="52" rx="4"/>
<rect x="316" y="30" width="118" height="52" rx="4"/>
<rect x="470" y="30" width="118" height="52" rx="4" stroke="#b97c26" stroke-width="2"/>
<rect x="624" y="30" width="88" height="52" rx="4"/>
<line x1="126" y1="56" x2="158" y2="56" marker-end="url(#ar)"/>
<line x1="280" y1="56" x2="312" y2="56" marker-end="url(#ar)"/>
<line x1="434" y1="56" x2="466" y2="56" marker-end="url(#ar)"/>
<line x1="588" y1="56" x2="620" y2="56" marker-end="url(#ar)"/>
</g>
<g font-size="12.5" fill="#2a2c30" text-anchor="middle" font-family="sans-serif" font-weight="600">
<text x="67" y="52">builder</text><text x="67" y="68">YAML</text>
<text x="221" y="52">dungeonspec</text><text x="221" y="68">validates</text>
<text x="375" y="52">compiled field</text><text x="375" y="68">carries</text>
<text x="529" y="52" fill="#b97c26">the run's world</text><text x="529" y="68" fill="#b97c26">acts</text>
<text x="668" y="52">each</text><text x="668" y="68">member</text>
</g>
<g font-size="10.5" fill="#2a2c30" opacity=".75" text-anchor="middle" font-family="monospace">
<text x="142" y="24">concealed: [...]</text>
<text x="298" y="24">refuses incoherence</text>
<text x="450" y="110">carried, not interpreted</text>
<text x="604" y="24">graph + journal</text>
<text x="668" y="110">projected</text>
</g>
</svg>
