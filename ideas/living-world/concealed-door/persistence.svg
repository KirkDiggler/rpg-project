<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-label="Two sources combine at load: the authored field reseeds the graph, and the blob's facts replay into the journal; who knows what is always derived as a fold over both, never stored."><rect x="0" y="0" width="640" height="170" fill="#f1f0ec" rx="6"/>
<defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2c30"/></marker></defs>
<g fill="none" stroke="#2a2c30" stroke-width="1.3">
<rect x="20" y="20" width="180" height="46" rx="4"/>
<rect x="20" y="104" width="180" height="46" rx="4"/>
<rect x="270" y="62" width="150" height="46" rx="4"/>
<rect x="490" y="62" width="130" height="46" rx="4" stroke="#b97c26" stroke-width="2"/>
<line x1="200" y1="43" x2="290" y2="70" marker-end="url(#ar3)"/>
<line x1="200" y1="127" x2="290" y2="100" marker-end="url(#ar3)"/>
<line x1="420" y1="85" x2="486" y2="85" marker-end="url(#ar3)"/>
</g>
<g font-size="12.5" fill="#2a2c30" text-anchor="middle" font-family="sans-serif" font-weight="600">
<text x="110" y="40">authored field</text><text x="110" y="56">(construction truth)</text>
<text x="110" y="124">blob facts</text><text x="110" y="140">(the only persistence)</text>
<text x="345" y="82">graph + journal</text><text x="345" y="98">rebuilt every load</text>
<text x="555" y="82" fill="#b97c26">who knows what</text><text x="555" y="98" fill="#b97c26">= a fold, never stored</text>
</g>
<g font-size="10.5" fill="#2a2c30" opacity=".75" font-family="monospace">
<text x="215" y="38">reseeds</text>
<text x="215" y="132">replays, same seqs</text>
</g>
</svg>
