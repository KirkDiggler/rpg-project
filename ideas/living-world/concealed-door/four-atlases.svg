<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" role="img" aria-label="Four panels showing the same dungeon as knowledge grows: the authored truth with hall, vault and concealed door; a stranger's atlas where the vault does not exist and a masquerade wall stands where the door is; a finder's atlas showing the door but no vault; and the atlas after the open, showing everything."><rect x="0" y="0" width="740" height="250" fill="#f1f0ec" rx="6"/>
<defs>
<pattern id="hid" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="8" stroke="#b97c26" stroke-width="1.4" opacity=".5"/>
</pattern>
</defs>
<!-- panel template: hall 20..90, wall x=90, vault 90..160 -->
<!-- P1 authored truth -->
<g transform="translate(10,28)">
<rect x="10" y="10" width="80" height="120" fill="none" stroke="#2a2c30" stroke-width="2.5"/>
<rect x="90" y="30" width="70" height="80" fill="url(#hid)" stroke="#b97c26" stroke-width="2"/>
<line x1="90" y1="10" x2="90" y2="60" stroke="#2a2c30" stroke-width="2.5"/>
<line x1="90" y1="84" x2="90" y2="130" stroke="#2a2c30" stroke-width="2.5"/>
<rect x="86" y="60" width="8" height="24" fill="#b97c26"/>
<text x="50" y="75" font-size="11" text-anchor="middle" fill="#2a2c30" font-family="monospace">hall</text>
<text x="125" y="75" font-size="11" text-anchor="middle" fill="#b97c26" font-family="monospace">vault</text>
<text x="85" y="160" font-size="12" text-anchor="middle" fill="#2a2c30" font-weight="600" font-family="sans-serif">① the authored truth</text>
</g>
<!-- P2 stranger -->
<g transform="translate(195,28)">
<rect x="10" y="10" width="80" height="120" fill="none" stroke="#2a2c30" stroke-width="2.5"/>
<line x1="90" y1="10" x2="90" y2="130" stroke="#2a2c30" stroke-width="2.5"/>
<text x="50" y="75" font-size="11" text-anchor="middle" fill="#2a2c30" font-family="monospace">hall</text>
<text x="125" y="72" font-size="10.5" text-anchor="middle" fill="#2a2c30" opacity=".55" font-family="monospace">(solid</text>
<text x="125" y="86" font-size="10.5" text-anchor="middle" fill="#2a2c30" opacity=".55" font-family="monospace">mass)</text>
<text x="85" y="160" font-size="12" text-anchor="middle" fill="#2a2c30" font-weight="600" font-family="sans-serif">② a stranger's atlas</text>
<text x="85" y="176" font-size="10.5" text-anchor="middle" fill="#2a2c30" opacity=".7" font-family="monospace">mask = a wall like any other</text>
</g>
<!-- P3 finder -->
<g transform="translate(380,28)">
<rect x="10" y="10" width="80" height="120" fill="none" stroke="#2a2c30" stroke-width="2.5"/>
<line x1="90" y1="10" x2="90" y2="60" stroke="#2a2c30" stroke-width="2.5"/>
<line x1="90" y1="84" x2="90" y2="130" stroke="#2a2c30" stroke-width="2.5"/>
<rect x="86" y="60" width="8" height="24" fill="#b97c26"/>
<text x="50" y="75" font-size="11" text-anchor="middle" fill="#2a2c30" font-family="monospace">hall</text>
<text x="125" y="72" font-size="10.5" text-anchor="middle" fill="#2a2c30" opacity=".55" font-family="monospace">(still</text>
<text x="125" y="86" font-size="10.5" text-anchor="middle" fill="#2a2c30" opacity=".55" font-family="monospace">solid)</text>
<text x="85" y="160" font-size="12" text-anchor="middle" fill="#2a2c30" font-weight="600" font-family="sans-serif">③ the finder's atlas</text>
<text x="85" y="176" font-size="10.5" text-anchor="middle" fill="#2a2c30" opacity=".7" font-family="monospace">door_revealed · door only</text>
</g>
<!-- P4 after open -->
<g transform="translate(565,28)">
<rect x="10" y="10" width="80" height="120" fill="none" stroke="#2a2c30" stroke-width="2.5"/>
<rect x="90" y="30" width="70" height="80" fill="#b97c2626" stroke="#b97c26" stroke-width="2"/>
<line x1="90" y1="10" x2="90" y2="60" stroke="#2a2c30" stroke-width="2.5"/>
<line x1="90" y1="84" x2="90" y2="130" stroke="#2a2c30" stroke-width="2.5"/>
<rect x="86" y="60" width="8" height="24" fill="none" stroke="#b97c26" stroke-width="1.5"/>
<text x="50" y="75" font-size="11" text-anchor="middle" fill="#2a2c30" font-family="monospace">hall</text>
<text x="125" y="75" font-size="11" text-anchor="middle" fill="#b97c26" font-family="monospace">vault</text>
<text x="85" y="160" font-size="12" text-anchor="middle" fill="#2a2c30" font-weight="600" font-family="sans-serif">④ after the open</text>
<text x="85" y="176" font-size="10.5" text-anchor="middle" fill="#2a2c30" opacity=".7" font-family="monospace">region_revealed · to perceivers</text>
</g>
</svg>
